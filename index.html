<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAFAF7" />
    <meta
      name="description"
      content="浮光 Shimmer — 一缕浮光，一段心情。用色彩记录生活的瞬时感动。浏览器内完成，图不上传。"
    />
    <title>浮光 Shimmer — 色彩日记与拼贴编辑器</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <!-- ============================ Top bar ============================= -->
    <header class="top-bar">
      <div class="top-bar__brand">
        <span class="wordmark">浮光<span class="wordmark__dot">·</span>shimmer</span>
        <span class="divider-v" aria-hidden="true"></span>
        <span class="file-name" id="file-name" data-i18n="file.empty">还没有照片</span>
      </div>

      <div class="top-bar__actions">
        <div class="lang-toggle" role="radiogroup" aria-label="Language">
          <button type="button" class="lang-toggle__btn is-active" data-lang="zh" role="radio">
            中
          </button>
          <button type="button" class="lang-toggle__btn" data-lang="en" role="radio">
            EN
          </button>
        </div>

        <button id="reset-btn" class="btn btn--ghost btn--sm" type="button" data-i18n="btn.reset">
          重置
        </button>
        <button id="export-btn" class="btn btn--primary btn--sm" type="button">
          <span data-i18n="btn.export">导出 PNG</span>
          <span class="btn__arrow" aria-hidden="true">↓</span>
        </button>
      </div>
    </header>

    <!-- ============================= Editor ============================= -->
    <main class="editor">
      <!-- ----------------------- Left: controls ---------------------- -->
      <aside class="panel" aria-label="Controls">
        <!-- Upload -->
        <section class="panel__section">
          <div class="panel__head">
            <p class="overline" data-i18n="section.source">01 · 来源</p>
          </div>
          <div
            class="upload-zone"
            id="upload-zone"
            tabindex="0"
            role="button"
            data-i18n-aria="upload.ariaLabel"
          >
            <div class="upload-zone__body">
              <span class="upload-zone__title serif-italic" data-i18n="upload.title">
                拖一张照片进来
              </span>
              <span class="upload-zone__hint" data-i18n="upload.hint">
                点击、拖拽、或粘贴 (Ctrl+V) · JPG / PNG / WebP
              </span>
            </div>
            <input
              id="file-input"
              type="file"
              accept="image/jpeg,image/png,image/webp,image/gif"
              hidden
            />
          </div>
        </section>

        <!-- Layout -->
        <section class="panel__section">
          <div class="panel__head">
            <p class="overline" data-i18n="section.layout">02 · 布局</p>
          </div>
          <div class="layout-grid" id="layout-grid" role="radiogroup" aria-label="Layout">
            <button type="button" class="layout-chip" data-layout="image-top" role="radio">
              <span class="layout-chip__glyph layout-chip__glyph--image-top" aria-hidden="true"></span>
              <span data-i18n="layout.img-top">图 / 色</span>
            </button>
            <button type="button" class="layout-chip" data-layout="image-bottom" role="radio">
              <span class="layout-chip__glyph layout-chip__glyph--image-bottom" aria-hidden="true"></span>
              <span data-i18n="layout.img-bottom">色 / 图</span>
            </button>
            <button type="button" class="layout-chip" data-layout="image-left" role="radio">
              <span class="layout-chip__glyph layout-chip__glyph--image-left" aria-hidden="true"></span>
              <span data-i18n="layout.img-left">图 | 色</span>
            </button>
            <button type="button" class="layout-chip" data-layout="image-right" role="radio">
              <span class="layout-chip__glyph layout-chip__glyph--image-right" aria-hidden="true"></span>
              <span data-i18n="layout.img-right">色 | 图</span>
            </button>
          </div>
          <p class="field__hint mono" data-i18n="hint.layout-auto">
            上传后根据照片比例自动选，色块与照片同尺寸
          </p>
        </section>

        <!-- Palette -->
        <section class="panel__section">
          <div class="panel__head">
            <p class="overline" data-i18n="section.palette">03 · 调色板</p>
            <span class="panel__hint mono" id="palette-hint">先上传一张图</span>
          </div>
          <div class="palette-chips" id="palette-chips"></div>
          <div class="palette-tools" id="palette-tools">
            <div class="field field--palette-tools">
              <div class="field__row field__row--align-center">
                <label class="field__label" for="block-color" data-i18n="label.block-color">
                  色块主色
                </label>
                <div class="palette-tools__controls">
                  <input
                    id="block-color"
                    type="color"
                    class="color-input color-input--palette"
                    value="#e6b422"
                    data-i18n-title="palette.pickerTitle"
                    data-i18n-aria="palette.picker.aria"
                  />
                  <button
                    type="button"
                    class="btn btn--ghost btn--sm palette-tools__eyedropper"
                    id="palette-eyedropper"
                    data-i18n-aria="palette.eyedropper.aria"
                    data-i18n-title="palette.eyedropper.title"
                  >
                    <svg class="palette-tools__dropper-icon" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M7 3L4 6c-.8.8-.8 2 0 2.8L10.2 15c.8.8 2.1.8 2.8 0l.7-.7c.4-.4.4-1 0-1.4L7.2 4.1c-.4-.4-1.1-.4-1.5 0L7 3z"/>
                      <path d="M2 18h8"/>
                    </svg>
                    <span data-i18n="palette.eyedropper.label">吸色</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- Shapes -->
        <section class="panel__section">
          <div class="panel__head">
            <p class="overline" data-i18n="section.shapes">04 · 形状</p>
            <span class="panel__hint mono" data-i18n="shapes.sub">创意拼贴</span>
          </div>

          <div class="field">
            <label class="field__label" data-i18n="label.fill-mode">填充模式</label>
            <div class="segmented" id="mode-group" role="radiogroup" aria-label="Fill mode">
              <button
                type="button"
                class="segmented__btn"
                data-mode="solid"
                role="radio"
                data-i18n="mode.solid"
              >
                实心
              </button>
              <button
                type="button"
                class="segmented__btn is-active"
                data-mode="cutout"
                role="radio"
                data-i18n="mode.cutout"
              >
                镂空
              </button>
            </div>
          </div>

          <div class="field" id="shape-color-field">
            <div class="field__row">
              <label class="field__label" for="shape-color" data-i18n="label.shape-color">
                形状颜色
              </label>
              <input id="shape-color" type="color" value="#111111" class="color-input" />
            </div>
          </div>

          <div class="field">
            <div class="field__row">
              <label class="field__label" for="size-range" data-i18n="label.shape-size">
                形状大小
              </label>
              <output class="field__value mono" id="size-value">0.12</output>
            </div>
            <input
              id="size-range"
              type="range"
              min="4"
              max="30"
              step="1"
              value="12"
            />
          </div>

          <div class="shape-grid" id="shape-grid"></div>

          <div class="text-adder">
            <input
              id="shape-text-input"
              type="text"
              class="text-input"
              data-i18n-placeholder="shape.text.placeholder"
              placeholder="输入文字... 例如 浮光"
              maxlength="40"
            />
            <button
              id="add-text-btn"
              class="btn btn--ghost btn--sm"
              type="button"
              data-i18n="shape.text.add"
            >
              添加文字
            </button>
          </div>

          <div class="actions-row">
            <button id="scatter-btn" class="btn btn--ghost btn--sm" type="button" data-i18n="btn.scatter">
              撒 8 个
            </button>
            <button id="clear-shapes-btn" class="btn btn--ghost btn--sm" type="button" data-i18n="btn.clear">
              清空
            </button>
          </div>

          <p class="selection-hint mono" id="selection-hint" hidden data-i18n="shape.selected">
            已选中 · 拖动移动 · Delete 删除
          </p>
        </section>

        <!-- Caption -->
        <section class="panel__section">
          <div class="panel__head">
            <p class="overline" data-i18n="section.caption">05 · 标题</p>
          </div>

          <div class="field">
            <label class="switch">
              <input id="caption-enabled" type="checkbox" checked />
              <span class="switch__dot" aria-hidden="true"></span>
              <span class="switch__label" data-i18n="caption.toggle">
                在色块上显示文字
              </span>
            </label>
          </div>

          <div class="field">
            <label class="field__label" for="caption-text" data-i18n="caption.label">
              文字
            </label>
            <input
              id="caption-text"
              type="text"
              class="text-input"
              data-i18n-placeholder="caption.placeholder"
              placeholder="如：mustard, 1:22 pm"
            />
            <p class="field__hint mono" id="caption-auto-hint">自动：—</p>
          </div>

          <div class="field">
            <label class="field__label" data-i18n="label.font">字体</label>
            <div class="segmented segmented--sm" id="font-group" role="radiogroup" aria-label="Caption font">
              <button type="button" class="segmented__btn is-active" data-font="serif-italic" role="radio">
                <em>serif</em>
              </button>
              <button type="button" class="segmented__btn" data-font="serif" role="radio">
                serif
              </button>
              <button type="button" class="segmented__btn" data-font="sans" role="radio">
                sans
              </button>
              <button type="button" class="segmented__btn" data-font="mono" role="radio">
                <span class="mono">mono</span>
              </button>
            </div>
          </div>
        </section>
      </aside>

      <!-- ---------------------- Right: canvas stage ------------------- -->
      <section class="stage" id="stage" aria-label="Preview">
        <!-- Big empty state — shown only when no image loaded -->
        <div class="stage__empty" id="stage-empty">
          <div class="stage__empty-inner">
            <svg class="stage__empty-icon" viewBox="0 0 64 64" aria-hidden="true">
              <rect x="10" y="14" width="44" height="36" rx="3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4"/>
              <circle cx="22" cy="26" r="4" fill="currentColor" opacity="0.4"/>
              <path d="M14 46 L26 34 L36 42 L44 34 L50 40 L50 48 L14 48 Z" fill="currentColor" opacity="0.4"/>
            </svg>
            <p class="stage__empty-title serif-italic" data-i18n="stage.empty.title">
              拖一张照片进来，开始你的色彩日记
            </p>
            <p class="stage__empty-hint" data-i18n="stage.empty.hint">
              所有处理都在你的浏览器里完成，图片不会上传。
            </p>
          </div>
        </div>

        <!-- Canvas — shown only when image is loaded -->
        <div class="stage__inner" id="stage-inner" hidden>
          <canvas id="canvas" aria-label="Composition preview"></canvas>
        </div>

        <!-- Zoom HUD — floating bottom-right inside the stage -->
        <div class="zoom-hud" id="zoom-hud" hidden>
          <button
            type="button"
            class="zoom-hud__btn"
            id="zoom-out-btn"
            data-i18n-aria="stage.zoom.out.aria"
            data-i18n-title="stage.zoom.out.title"
          >
            −
          </button>
          <button
            type="button"
            class="zoom-hud__val mono"
            id="zoom-val-btn"
            data-i18n-aria="stage.zoom.reset.aria"
            data-i18n-title="stage.zoom.reset.title"
          >
            100%
          </button>
          <button
            type="button"
            class="zoom-hud__btn"
            id="zoom-in-btn"
            data-i18n-aria="stage.zoom.in.aria"
            data-i18n-title="stage.zoom.in.title"
          >
            +
          </button>
        </div>

        <p class="stage__meta mono" id="stage-meta" hidden>—</p>
      </section>
    </main>

    <!-- Hidden anchor for programmatic downloads -->
    <a id="download-anchor" aria-hidden="true" hidden></a>
  </body>
</html>
