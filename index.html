<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAFAF7" />
    <meta
      name="description"
      content="Shimmer — upload a photo, get a color-block diary. A niche aesthetic image design tool."
    />
    <title>Shimmer — color diary editor</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <!-- ============================ Top bar ============================= -->
    <header class="top-bar">
      <div class="top-bar__brand">
        <span class="wordmark">shimmer<span class="wordmark__dot">.</span></span>
        <span class="divider-v" aria-hidden="true"></span>
        <span class="file-name" id="file-name" title="current photo">no photo yet</span>
      </div>

      <div class="top-bar__actions">
        <label class="select">
          <span class="select__label">Ratio</span>
          <select id="ratio-select" aria-label="Aspect ratio">
            <option value="3:4">3 : 4</option>
            <option value="4:3">4 : 3</option>
            <option value="1:1">1 : 1</option>
            <option value="9:16">9 : 16</option>
            <option value="16:9">16 : 9</option>
          </select>
        </label>

        <button id="reset-btn" class="btn btn--ghost btn--sm" type="button">
          Reset
        </button>
        <button id="export-btn" class="btn btn--primary btn--sm" type="button">
          <span>Export PNG</span>
          <span class="btn__arrow" aria-hidden="true">↓</span>
        </button>
      </div>
    </header>

    <!-- ============================= Editor ============================= -->
    <main class="editor">
      <!-- ----------------------- Left: controls ---------------------- -->
      <aside class="panel" aria-label="Controls">
        <!-- Upload -->
        <section class="panel__section">
          <div class="panel__head">
            <p class="overline">01 · Source</p>
          </div>
          <div class="upload-zone" id="upload-zone" tabindex="0" role="button">
            <div class="upload-zone__body">
              <span class="upload-zone__title serif-italic">Drop a photo</span>
              <span class="upload-zone__hint">
                或点击上传 · 支持粘贴 (Ctrl+V) · JPG / PNG / WebP
              </span>
            </div>
            <input
              id="file-input"
              type="file"
              accept="image/jpeg,image/png,image/webp,image/gif"
              hidden
            />
          </div>
        </section>

        <!-- Layout -->
        <section class="panel__section">
          <div class="panel__head">
            <p class="overline">02 · Layout</p>
          </div>
          <div class="layout-grid" id="layout-grid" role="radiogroup" aria-label="Layout">
            <button type="button" class="layout-chip" data-layout="image-top" role="radio">
              <span class="layout-chip__glyph layout-chip__glyph--image-top" aria-hidden="true"></span>
              <span>图 / 色</span>
            </button>
            <button type="button" class="layout-chip" data-layout="image-bottom" role="radio">
              <span class="layout-chip__glyph layout-chip__glyph--image-bottom" aria-hidden="true"></span>
              <span>色 / 图</span>
            </button>
            <button type="button" class="layout-chip" data-layout="image-left" role="radio">
              <span class="layout-chip__glyph layout-chip__glyph--image-left" aria-hidden="true"></span>
              <span>图 | 色</span>
            </button>
            <button type="button" class="layout-chip" data-layout="image-right" role="radio">
              <span class="layout-chip__glyph layout-chip__glyph--image-right" aria-hidden="true"></span>
              <span>色 | 图</span>
            </button>
          </div>

          <div class="field">
            <div class="field__row">
              <label class="field__label" for="split-range">Split</label>
              <output class="field__value mono" id="split-value">50%</output>
            </div>
            <input
              id="split-range"
              type="range"
              min="25"
              max="75"
              step="1"
              value="50"
            />
          </div>

          <div class="field">
            <label class="field__label">Image fit</label>
            <div class="segmented" id="fit-group" role="radiogroup" aria-label="Image fit">
              <button type="button" class="segmented__btn" data-fit="contain" role="radio">
                contain
              </button>
              <button type="button" class="segmented__btn" data-fit="cover" role="radio">
                cover
              </button>
            </div>
          </div>
        </section>

        <!-- Palette -->
        <section class="panel__section">
          <div class="panel__head">
            <p class="overline">03 · Palette</p>
            <span class="panel__hint mono" id="palette-hint">upload an image first</span>
          </div>
          <div class="palette-chips" id="palette-chips"></div>
        </section>

        <!-- Shapes -->
        <section class="panel__section">
          <div class="panel__head">
            <p class="overline">04 · Shapes</p>
            <span class="panel__hint mono">creative collage</span>
          </div>

          <div class="field">
            <label class="field__label">Fill mode</label>
            <div class="segmented" id="mode-group" role="radiogroup" aria-label="Fill mode">
              <button type="button" class="segmented__btn is-active" data-mode="solid" role="radio">
                solid
              </button>
              <button type="button" class="segmented__btn" data-mode="cutout" role="radio">
                cutout
              </button>
            </div>
          </div>

          <div class="field" id="shape-color-field">
            <div class="field__row">
              <label class="field__label" for="shape-color">Shape color</label>
              <input id="shape-color" type="color" value="#111111" class="color-input" />
            </div>
          </div>

          <div class="shape-grid" id="shape-grid"></div>

          <div class="actions-row">
            <button id="scatter-btn" class="btn btn--ghost btn--sm" type="button">
              Scatter 8
            </button>
            <button id="clear-shapes-btn" class="btn btn--ghost btn--sm" type="button">
              Clear
            </button>
          </div>
        </section>

        <!-- Caption -->
        <section class="panel__section">
          <div class="panel__head">
            <p class="overline">05 · Caption</p>
          </div>

          <div class="field">
            <label class="switch">
              <input id="caption-enabled" type="checkbox" checked />
              <span class="switch__dot" aria-hidden="true"></span>
              <span class="switch__label">Show caption on color block</span>
            </label>
          </div>

          <div class="field">
            <label class="field__label" for="caption-text">Text</label>
            <input
              id="caption-text"
              type="text"
              class="text-input"
              placeholder="e.g. mustard, 1:22 pm"
            />
            <p class="field__hint mono" id="caption-auto-hint">auto: —</p>
          </div>

          <div class="field">
            <label class="field__label">Font</label>
            <div class="segmented segmented--sm" id="font-group" role="radiogroup" aria-label="Caption font">
              <button type="button" class="segmented__btn is-active" data-font="serif-italic" role="radio">
                <em>serif</em>
              </button>
              <button type="button" class="segmented__btn" data-font="serif" role="radio">
                serif
              </button>
              <button type="button" class="segmented__btn" data-font="sans" role="radio">
                sans
              </button>
              <button type="button" class="segmented__btn" data-font="mono" role="radio">
                <span class="mono">mono</span>
              </button>
            </div>
          </div>
        </section>
      </aside>

      <!-- ---------------------- Right: canvas stage ------------------- -->
      <section class="stage" id="stage" aria-label="Preview">
        <div class="stage__inner" id="stage-inner">
          <canvas id="canvas" aria-label="Composition preview"></canvas>
          <div class="stage__dropzone" id="stage-dropzone" aria-hidden="true">
            <span class="serif-italic">Drop your photo here</span>
          </div>
        </div>
        <p class="stage__meta mono" id="stage-meta">— · — · —</p>
      </section>
    </main>

    <!-- Hidden anchor for programmatic downloads -->
    <a id="download-anchor" aria-hidden="true" hidden></a>
  </body>
</html>
